<script>

(function () {

    var infoButton = document.getElementById("info-button");
    var infoModal = document.getElementById("info-modal");
    var closeInfo = document.getElementById("close-info");

    function openInfo(event) {
        event.stopPropagation();

        infoModal.classList.add("open");
        infoModal.setAttribute("aria-hidden", "false");
        closeInfo.focus();
    }

    function closeInfoModal(event) {
        if (event) {
            event.stopPropagation();
        }
        infoModal.classList.remove("open");
        infoModal.setAttribute("aria-hidden", "true");
        infoButton.focus();
    }

    infoButton.addEventListener("click", openInfo);
    closeInfo.addEventListener("click", closeInfoModal);

    infoModal.addEventListener("click", function (event) {
        event.stopPropagation();

        if (event.target === infoModal) {
            closeInfoModal(event);
        }
    });

    document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && infoModal.classList.contains("open")) {
            closeInfoModal();
        }
    });

    var cacheButton = document.getElementById("cache-button");

    cacheButton.addEventListener("click", function (event) {
        event.stopPropagation();
        window.location.href = "cache.html";
    });

})();
</script>

<script>

(function () {

    var con = document.getElementById("console");

    function print(msg, cls) {

        var span = document.createElement("span");

        if (cls) {
            span.className = cls;
        }

        var parts = msg.split("[[X]]");

        for (var i = 0; i < parts.length; i++) {

            if (parts[i]) {
                span.appendChild(
                    document.createTextNode(parts[i])
                );
            }

            if (i < parts.length - 1) {

                var img = document.createElement("img");

                img.src = "PS4%20Cross.png";

                img.className = "cross-icon";

                img.alt = "X";

                span.appendChild(img);
            }

        }

        span.appendChild(
            document.createTextNode("\n")
        );

        con.appendChild(span);
    }

    var params =
        new URLSearchParams(location.search);

    // Firmwares with measured kernel table — KEEP IN SYNC with ps4_offsets.js

    var SUPPORTED = {

        1302: 1,
        1304: 1,
        1350: 1,
        1352: 1

    };

    var key = null,
        fwnum = null;

    var m =
        /PlayStation\s+4[\/ ]\((\d+)\.(\d+)/.exec(
            navigator.userAgent
        );

    if (m) {

        var ms =
            parseInt(m[2], 16).toString(16);

        if (ms.length < 2) {
            ms = "0" + ms;
        }

        key =
            m[1] + "." + ms;

        fwnum =
            parseInt(m[1], 10) * 100 +
            parseInt(ms, 10);
    }

    var forced =
        params.get("force") === "1";

    var supported =
        forced ||
        (
            fwnum !== null &&
            SUPPORTED[fwnum] === 1
        );

    print(
        "Firmware: " +
        (key || "unknown")
    );

    print(
        "Compatibilidade: " +
        (
            supported
                ? "OK"
                : "NÃO SUPORTADO"
        ),
        supported
            ? "ok"
            : "bad"
    );

    var target =
        "jb.html" +
        location.search;

    function go() {

        print(
            "Iniciando...",
            "warn"
        );

        location.replace(target);
    }

    function waitForTap(msg, action) {

        if (msg) {
            print(msg, "warn");
        }

        function fire() {

            window.removeEventListener(
                "click",
                fire
            );

            window.removeEventListener(
                "keydown",
                fire
            );

            action();
        }

        window.addEventListener(
            "click",
            fire
        );

        window.addEventListener(
            "keydown",
            fire
        );
    }

    if (!supported) {

        print(
            "FIRMWARE NÃO SUPORTADO",
            "bad"
        );

        print(
            "Toque na tela / pressione [[X]] para continuar",
            "warn"
        );

        waitForTap(
            "",
            go
        );

        return;
    }

    var ac =
        window.applicationCache;

    if (
        !ac ||
        !document.documentElement.hasAttribute(
            "manifest"
        )
    ) {

        go();

    } else if (!navigator.onLine) {

        print(
            "Modo offline — usando cache",
            "ok"
        );

        go();

    } else if (
        ac.status === ac.IDLE
    ) {

        print(
            "Cache disponível",
            "ok"
        );

        go();

    } else if (
        ac.status === ac.UPDATEREADY
    ) {

        try {

            ac.swapCache();

        } catch (e) {}

        print(
            "Atualização disponível",
            "ok"
        );

        waitForTap(
            "Pressione [[X]] para recarregar",

            function () {

                location.reload();

            }
        );

    } else {

        print(
            "Verificando cache..."
        );

        ac.addEventListener(

            "downloading",

            function () {

                print(
                    "Preparando cache para uso offline..."
                );

            },

            false

        );

        ac.addEventListener(

            "progress",

            function (e) {

                if (e && e.total) {

                    print(
                        "Cache: " +
                        Math.round(
                            (e.loaded / e.total) * 100
                        ) +
                        "%"
                    );

                }

            },

            false

        );

        ac.addEventListener(

            "cached",

            function () {

                print(
                    "Cache instalado com sucesso",
                    "ok"
                );

                waitForTap(
                    "Pressione [[X]] para iniciar",
                    go
                );

            },

            false

        );

        ac.addEventListener(

            "updateready",

            function () {

                try {

                    ac.swapCache();

                } catch (e) {}

                print(
                    "Atualização baixada",
                    "ok"
                );

                waitForTap(

                    "Pressione [[X]] para recarregar",

                    function () {

                        location.reload();

                    }

                );

            },

            false

        );

        ac.addEventListener(

            "noupdate",

            function () {

                print(
                    "Cache pronto para uso offline",
                    "ok"
                );

                go();

            },

            false

        );

        ac.addEventListener(

            "error",

            function () {

                print(
                    "Não foi possível acessar o cache",
                    "bad"
                );

                waitForTap(

                    "Pressione [[X]] para continuar mesmo assim",

                    go

                );

            },

            false

        );

        ac.addEventListener(

            "obsolete",

            function () {

                print(
                    "Cache obsoleto",
                    "bad"
                );

                waitForTap(

                    "Pressione [[X]] para continuar",

                    go

                );

            },

            false

        );

    }

})();

</script>
