    <!-- INFO / CACHE UI -->

    <script>

    (function () {

        var infoButton =
            document.getElementById(
                "info-button"
            );

        var infoModal =
            document.getElementById(
                "info-modal"
            );

        var closeInfo =
            document.getElementById(
                "close-info"
            );


        function openInfo(event) {

            event.stopPropagation();

            infoModal.classList.add(
                "open"
            );

            infoModal.setAttribute(
                "aria-hidden",
                "false"
            );

            closeInfo.focus();

        }


        function closeInfoModal(event) {

            if (event) {
                event.stopPropagation();
            }

            infoModal.classList.remove(
                "open"
            );

            infoModal.setAttribute(
                "aria-hidden",
                "true"
            );

            infoButton.focus();

        }


        infoButton.addEventListener(
            "click",
            openInfo
        );


        closeInfo.addEventListener(
            "click",
            closeInfoModal
        );


        infoModal.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

                if (
                    event.target ===
                    infoModal
                ) {

                    closeInfoModal(
                        event
                    );

                }

            }
        );


        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Escape" &&
                    infoModal.classList.contains(
                        "open"
                    )
                ) {

                    closeInfoModal();

                }

            }
        );


        var cacheButton =
            document.getElementById(
                "cache-button"
            );


        cacheButton.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

                window.location.href =
                    "cache.html";

            }
        );

    })();

    </script>


    <!-- CONSOLE / FIRMWARE -->

    <script>

    (function () {

        var con =
            document.getElementById(
                "console"
            );


        function print(msg, cls) {

            var span =
                document.createElement(
                    "span"
                );


            if (cls) {

                span.className =
                    cls;

            }


            var parts =
                msg.split("[[X]]");


            for (
                var i = 0;
                i < parts.length;
                i++
            ) {

                if (parts[i]) {

                    span.appendChild(
                        document.createTextNode(
                            parts[i]
                        )
                    );

                }


                if (
                    i <
                    parts.length - 1
                ) {

                    var img =
                        document.createElement(
                            "img"
                        );


                    img.src =
                        "PS4%20Cross.png";

                    img.className =
                        "cross-icon";

                    img.alt =
                        "X";


                    span.appendChild(
                        img
                    );

                }

            }


            span.appendChild(
                document.createTextNode(
                    "\n"
                )
            );


            con.appendChild(
                span
            );

        }


        /*
         * FIRMWARE
         *
         * Apenas comparação visual
         * com as versões mostradas
         * no painel de informações.
         */

        var SUPPORTED = {

            "11.00": true,
            "11.50": true,
            "12.00": true,
            "12.50": true,
            "13.00": true,
            "13.02": true,
            "13.50": true,
            "13.52": true

        };


        var m =
            /PlayStation\s+4[\/ ]\((\d+)\.(\d+)/i
                .exec(
                    navigator.userAgent
                );


        if (m) {

            var major =
                parseInt(
                    m[1],
                    10
                );


            var minor =
                parseInt(
                    m[2],
                    10
                );


            var minorText =
                minor < 10
                    ? "0" + minor
                    : String(minor);


            var key =
                major +
                "." +
                minorText;


            print(
                "Firmware: " +
                key,
                "warn"
            );


            if (
                SUPPORTED[key]
            ) {

                print(
                    "Compatibilidade: OK",
                    "ok"
                );

            } else {

                print(
                    "Compatibilidade: NÃO SUPORTADO",
                    "bad"
                );

            }

        } else {

            print(
                "Firmware: não identificado",
                "warn"
            );


            print(
                "Compatibilidade: desconhecida",
                "warn"
            );

        }


        /*
         * O Application Cache continua
         * associado à página, mas o
         * index.html não exibe seus
         * eventos/progresso.
         *
         * Nenhum evento de cache é
         * impresso no console.
         */

        var ac =
            window.applicationCache;


        if (
            ac &&
            ac.status === ac.UPDATEREADY
        ) {

            try {
                ac.swapCache();
            } catch (e) {}

        }

    })();

    </script>
