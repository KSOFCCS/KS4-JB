<!doctype html>
<html lang="pt-BR" manifest="cache.appcache">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>KS4-JB · PS4 Exploit</title>

    <link rel="icon" type="image/png" href="Icon.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #0b0b0f;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        #main-container {
            position: relative;

            width: 90%;
            max-width: 520px;
            min-height: 330px;

            padding: 38px 30px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            background: #111117;

            border: 1px solid #292932;
            border-radius: 18px;
        }

        #brand {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 8px;
            color: #fff;
        }

        #brand span {
            color: #4d8dff;
        }

        #subtitle {
            color: #8f8f9d;
            font-size: 14px;
            margin-bottom: 34px;
        }

        #visual-indicator {
            position: relative;

            width: 72px;
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 26px;
        }

        .ps4-icon {
            position: relative;

            width: 44px;
            height: 44px;

            display: block;
            object-fit: contain;

            z-index: 2;
        }

        .pulse {
            position: absolute;

            width: 100%;
            height: 100%;

            border-radius: 50%;
            border: 2px solid #4d8dff;

            animation: subtle-pulse 2s infinite ease-in-out;
        }

        #spin {
            position: absolute;

            width: 125%;
            height: 125%;

            border: 2px solid transparent;
            border-top-color: #fff;

            border-radius: 50%;

            animation: real-spin 0.9s linear infinite;

            opacity: 0.25;
        }

        #status {
            min-height: 22px;

            color: #eee;

            font-family: monospace;
            font-size: 15px;
            line-height: 1.5;
        }

        #percent {
            min-height: 20px;

            margin-top: 5px;

            color: #8faeff;

            font-family: monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        #footer {
            position: fixed;

            bottom: 20px;
            left: 0;
            right: 0;

            text-align: center;

            font-family: monospace;
            font-size: 11px;

            color: #555560;

            letter-spacing: 0.08em;
        }

        #footer b {
            color: #777783;
        }


        /*
         * CACHE CONCLUÍDO
         */

        body.done #spin {
            animation: none;

            border-top-color: #f5c542;
            border-left-color: rgba(245, 197, 66, 0.12);
            border-right-color: rgba(245, 197, 66, 0.12);
            border-bottom-color: rgba(245, 197, 66, 0.12);
        }

        body.done .pulse {
            animation: none;

            border-color: #f5c542;
            opacity: 0.65;
        }

        body.done #brand span {
            color: #f5c542;
        }

        body.done #percent {
            color: #f5c542;
        }


        /*
         * ERRO
         */

        body.error #spin {
            animation: none;

            border-top-color: #ff5c5c;
            border-left-color: rgba(255, 92, 92, 0.12);
            border-right-color: rgba(255, 92, 92, 0.12);
            border-bottom-color: rgba(255, 92, 92, 0.12);
        }

        body.error .pulse {
            animation: none;

            border-color: #ff5c5c;
        }

        body.error #brand span {
            color: #ff5c5c;
        }

        body.error #percent {
            color: #ff5c5c;
        }


        /*
         * ANIMAÇÕES
         */

        @keyframes real-spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes subtle-pulse {
            0% {
                transform: scale(0.96);
                opacity: 0.45;
            }

            50% {
                transform: scale(1.04);
                opacity: 0.8;
            }

            100% {
                transform: scale(0.96);
                opacity: 0.45;
            }
        }


        /*
         * TELA PEQUENA
         */

        @media (max-width: 430px) {

            #main-container {
                padding: 34px 22px;
            }

            #brand {
                font-size: 40px;
            }

        }
    </style>
</head>

<body>

    <div id="main-container">

        <div id="brand">
            KS<span>4</span>
        </div>

        <div id="subtitle">
            KSOFCC · PS4 EXPLOIT
        </div>

        <div id="visual-indicator">

            <img
                id="ps4-icon"
                class="ps4-icon"
                src="PSICON4.png"
                alt=""
                draggable="false"
            >

            <div id="spin"></div>

            <div class="pulse"></div>

        </div>

        <div id="status">
            Preparando cache...
        </div>

        <div id="percent">
            0%
        </div>

    </div>

    <div id="footer">
        <b>KS4-JB</b> · 2026
    </div>


    <script>

        /*
         * Volta para o index.html,
         * igual ao cache.html original.
         */

        history.replaceState(
            null,
            null,
            "index.html"
        );

        var histlength = history.length;

        history.go(-histlength);


        /*
         * ELEMENTOS DA INTERFACE
         */

        var statusElement =
            document.getElementById("status");

        var percentElement =
            document.getElementById("percent");


        /*
         * PROGRESSO DO CACHE
         */

        function DLProgress(e) {

            var pct = 0;

            if (
                e &&
                typeof e.loaded === "number" &&
                typeof e.total === "number" &&
                e.total > 0
            ) {

                pct = Math.round(
                    (e.loaded / e.total) * 100
                );

            }

            if (pct < 0) {
                pct = 0;
            }

            if (pct > 100) {
                pct = 100;
            }

            statusElement.innerHTML =
                "Instalando cache...";

            percentElement.innerHTML =
                pct + "%";
        }


        /*
         * CACHE INSTALADO / ATUALIZADO
         */

        function DisplayCacheProgress() {

            statusElement.innerHTML =
                "Cache instalado com sucesso";

            percentElement.innerHTML =
                "100%";

            document.body.classList.remove(
                "error"
            );

            document.body.classList.add(
                "done"
            );


            /*
             * Dá tempo para mostrar
             * o estado concluído.
             */

            setTimeout(
                function () {

                    location.reload();

                },
                3000
            );
        }


        /*
         * APPLICATION CACHE
         *
         * No PS4, se o navegador oferecer
         * Application Cache, ele será usado
         * normalmente.
         *
         * Em navegadores modernos que não
         * possuem essa API, evitamos o erro
         * "undefined.addEventListener".
         */

        if (
            typeof window.applicationCache !==
            "undefined"
        ) {

            var appCache =
                window.applicationCache;


            /*
             * DOWNLOAD EM ANDAMENTO
             */

            appCache.addEventListener(
                "progress",
                DLProgress,
                false
            );


            /*
             * PRIMEIRA INSTALAÇÃO
             */

            appCache.addEventListener(
                "cached",
                function () {

                    DisplayCacheProgress();

                },
                false
            );


            /*
             * CACHE ATUALIZADO
             */

            appCache.addEventListener(
                "updateready",
                function () {

                    DisplayCacheProgress();

                },
                false
            );


            /*
             * NENHUMA ATUALIZAÇÃO
             *
             * Significa que o cache já estava
             * disponível.
             */

            appCache.addEventListener(
                "noupdate",
                function () {

                    statusElement.innerHTML =
                        "Cache já está instalado";

                    percentElement.innerHTML =
                        "100%";

                    document.body.classList.add(
                        "done"
                    );


                    setTimeout(
                        function () {

                            location.reload();

                        },
                        3000
                    );

                },
                false
            );


            /*
             * ERRO NO CACHE
             */

            appCache.addEventListener(
                "error",
                function () {

                    statusElement.innerHTML =
                        "Erro ao preparar cache";

                    percentElement.innerHTML =
                        "ERRO";

                    document.body.classList.remove(
                        "done"
                    );

                    document.body.classList.add(
                        "error"
                    );

                },
                false
            );


        } else {

            /*
             * IMPORTANTE:
             *
             * Isso somente aparece em navegadores
             * que NÃO possuem Application Cache.
             *
             * Não tentamos chamar addEventListener
             * em undefined.
             */

            statusElement.innerHTML =
                "Application Cache indisponível";

            percentElement.innerHTML =
                "--";

        }

    </script>


    <script>

        /*
         * BLOQUEIOS DE INTERFACE
         */

        document.addEventListener(
            "contextmenu",
            function (e) {
                e.preventDefault();
            }
        );

        document.addEventListener(
            "copy",
            function (e) {
                e.preventDefault();
            }
        );

        document.addEventListener(
            "cut",
            function (e) {
                e.preventDefault();
            }
        );

        document.addEventListener(
            "paste",
            function (e) {
                e.preventDefault();
            }
        );

        document.addEventListener(
            "selectstart",
            function (e) {
                e.preventDefault();
            }
        );

        document.addEventListener(
            "dragstart",
            function (e) {
                e.preventDefault();
            }
        );

    </script>

</body>
</html>
