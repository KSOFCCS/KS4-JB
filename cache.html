<html manifest="cache.appcache">
<head>

    <link rel="icon" type="image/png" href="Icon.png">
    <title>KS4-JB · PS4 Exploit</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
    }

    body {
        background: #0b0b0f;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .container {
        width: 90%;
        max-width: 520px;
        padding: 38px 30px;
        text-align: center;
        background: #111117;
        border: 1px solid #292932;
        border-radius: 18px;
    }

    .logo {
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -2px;
        margin-bottom: 8px;
    }

    .logo span {
        color: #4d8dff;
    }

    .subtitle {
        color: #8f8f9d;
        font-size: 14px;
        margin-bottom: 32px;
    }

    .status {
        font-family: monospace;
        font-size: 17px;
        color: #eeeeee;
        min-height: 24px;
    }

    .progress-container {
        width: 100%;
        height: 7px;
        margin-top: 22px;
        background: #24242d;
        border-radius: 20px;
        overflow: hidden;
    }

    .progress {
        width: 0%;
        height: 100%;
        background: #4d8dff;
        border-radius: 20px;
        transition: width 0.2s ease;
    }

    .footer {
        margin-top: 28px;
        color: #555560;
        font-size: 12px;
    }

    .footer b {
        color: #777783;
    }
    </style>

    <script>
    function DLProgress(e) {
        if (!e || !e.total) {
            return;
        }

        var pct = Math.round(e.loaded / e.total * 100);

        msgs.innerHTML = "Instalando cache... " + pct + "%";
        progress.style.width = pct + "%";
    }

    function DisplayCacheProgress() {
        msgs.innerHTML = "Cache instalado com sucesso";
        progress.style.width = "100%";

        setTimeout(function () {
            location.replace("index.html");
        }, 2000);
    }

    window.applicationCache.addEventListener(
        "progress",
        DLProgress,
        false
    );

    window.applicationCache.oncached = function (e) {
        DisplayCacheProgress();
    };

    window.applicationCache.onupdateready = function (e) {
        DisplayCacheProgress();
    };
    </script>

</head>

<body>

<div class="container">

    <div class="logo">
        KS<span>4</span>
    </div>

    <div class="subtitle">
        KSOFCC · PS4 EXPLOIT
    </div>

    <div id="msgs" class="status">
        Preparando cache...
    </div>

    <div class="progress-container">
        <div id="progress" class="progress"></div>
    </div>

    <div class="footer">
        <b>KS4 JB</b> · 2026
    </div>

</div>

</body>
</html>
