<!doctype html>
<html lang="pt-BR" manifest="cache.appcache">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="icon"
        type="image/png"
        href="Icon.png"
    >

    <title>KS4-JB · PS4 Exploit</title>

    <style>

        * {
            box-sizing: border-box;

            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;

            -webkit-touch-callout: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #0b0b0f;
            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        img {
            -webkit-user-drag: none;
            user-drag: none;
            pointer-events: none;
        }

        .container {
            width: 90%;
            max-width: 520px;

            padding: 38px 30px;

            text-align: center;

            background: #111117;

            border: 1px solid #292932;

            border-radius: 18px;
        }

        .logo {
            font-size: 42px;
            font-weight: 800;

            letter-spacing: -2px;

            margin-bottom: 8px;
        }

        .logo span {
            color: #4d8dff;
        }

        .subtitle {
            color: #8f8f9d;

            font-size: 14px;

            margin-bottom: 28px;
        }

        /*
         * ÁREA DO CACHE
         */

        .cache-area {
            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;
        }

        /*
         * ÍCONE + SPINNER
         */

        .visual-indicator {
            position: relative;

            width: 100px;
            height: 100px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin: 5px auto 20px;
        }

        /*
         * Spinner externo
         */

        #spin {
            position: absolute;

            width: 82px;
            height: 82px;

            border-radius: 50%;

            border: 2px solid rgba(77, 141, 255, 0.16);

            border-top-color: #4d8dff;

            animation:
                rotate 1s linear infinite;
        }

        /*
         * PSICON4
         *
         * O PNG é usado como máscara.
         * Isso permite manter uma cor sólida.
         */

        #ps4-icon {
            position: relative;

            width: 46px;
            height: 46px;

            z-index: 2;

            background-color: #4d8dff;

            -webkit-mask-image:
                url("PSICON4.png");

            mask-image:
                url("PSICON4.png");

            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;

            -webkit-mask-position: center;
            mask-position: center;

            -webkit-mask-size: contain;
            mask-size: contain;

            transition:
                background-color 0.3s ease;
        }

        /*
         * STATUS
         */

        #status {
            min-height: 23px;

            color: #d9d9e2;

            font-family: monospace;

            font-size: 15px;

            line-height: 1.45;
        }

        /*
         * PORCENTAGEM
         */

        #percent {
            margin-top: 8px;

            min-height: 22px;

            color: #8faeff;

            font-family: monospace;

            font-size: 14px;

            font-weight: bold;
        }

        /*
         * RODAPÉ
         */

        .footer {
            margin-top: 28px;

            color: #555560;

            font-size: 12px;
        }

        .footer b {
            color: #777783;
        }

        /*
         * SUCESSO
         */

        body.done #ps4-icon {
            background-color: #f5c542;
        }

        body.done #spin {
            animation: none;

            border-color:
                rgba(245, 197, 66, 0.16);

            border-top-color: #f5c542;
        }

        body.done #percent {
            color: #f5c542;
        }

        body.done .logo span {
            color: #f5c542;
        }

        /*
         * ERRO
         */

        body.fail #ps4-icon {
            background-color: #ff5c5c;
        }

        body.fail #spin {
            animation: none;

            border-color:
                rgba(255, 92, 92, 0.16);

            border-top-color: #ff5c5c;
        }

        body.fail #percent {
            color: #ff7070;
        }

        body.fail .logo span {
            color: #ff7070;
        }

        /*
         * ANIMAÇÃO DO SPINNER
         */

        @keyframes rotate {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        /*
         * CELULARES PEQUENOS
         */

        @media (max-width: 430px) {

            .container {
                padding: 32px 22px;
            }

            .logo {
                font-size: 38px;
            }

        }

    </style>

    <script>

        /*
         * MANTIDO DO CACHE ORIGINAL
         */

        history.replaceState(
            null,
            null,
            'index.html'
        );

        var histlength =
            history.length;

        history.go(-histlength);


        /*
         * PROGRESSO DO CACHE
         */

        function DLProgress(e) {

            var pct =
                Math.round(
                    e.loaded /
                    e.total *
                    100
                );

            document.getElementById(
                "status"
            ).innerHTML =
                "Instalando cache...";

            document.getElementById(
                "percent"
            ).innerHTML =
                pct + "%";

        }


        /*
         * CACHE CONCLUÍDO
         */

        function DisplayCacheProgress() {

            document.getElementById(
                "status"
            ).innerHTML =
                "Cache instalado com sucesso";

            document.getElementById(
                "percent"
            ).innerHTML =
                "100%";

            document.body.classList.add(
                "done"
            );


            setTimeout(
                function () {

                    location.reload();

                },
                3000
            );

        }


        /*
         * APPLICATION CACHE
         */

        window.applicationCache.addEventListener(
            "progress",
            DLProgress,
            false
        );


        window.applicationCache.oncached =
            function (e) {

                DisplayCacheProgress();

            };


        window.applicationCache.onupdateready =
            function (e) {

                DisplayCacheProgress();

            };

    </script>

</head>


<body>

    <div class="container">

        <div class="logo">
            KS<span>4</span>
        </div>

        <div class="subtitle">
            KSOFCC · PS4 EXPLOIT
        </div>


        <div class="cache-area">

            <div class="visual-indicator">

                <div id="spin"></div>

                <div id="ps4-icon"></div>

            </div>


            <div id="status">
                Preparando cache...
            </div>


            <div id="percent">
                0%
            </div>

        </div>


        <div class="footer">
            <b>KS4-JB</b> · 2026
        </div>

    </div>


    <script>

        /*
         * BLOQUEIA MENU DE CONTEXTO
         */

        document.addEventListener(
            "contextmenu",
            function (event) {

                event.preventDefault();

            }
        );


        /*
         * BLOQUEIA COPIAR
         */

        document.addEventListener(
            "copy",
            function (event) {

                event.preventDefault();

            }
        );


        /*
         * BLOQUEIA RECORTAR
         */

        document.addEventListener(
            "cut",
            function (event) {

                event.preventDefault();

            }
        );


        /*
         * BLOQUEIA COLAR
         */

        document.addEventListener(
            "paste",
            function (event) {

                event.preventDefault();

            }
        );


        /*
         * BLOQUEIA SELEÇÃO
         */

        document.addEventListener(
            "selectstart",
            function (event) {

                event.preventDefault();

            }
        );


        /*
         * BLOQUEIA ARRASTAR
         */

        document.addEventListener(
            "dragstart",
            function (event) {

                event.preventDefault();

            }
        );

    </script>

</body>

</html>
