@keyframes drift {
    0% {

    }

    100% {

    }
}

@keyframes real-spin {

}

@keyframes subtle-pulse {
    0% {
        transform: scale(0.96);
        opacity: 0.45;

    50% {

        opacity: 0.8;

(function () {

    function updateUI() {

        if (document.body.classList.contains("done")) {

            document.getElementById("status").setAttribute(
                "aria-label",
                "Finalizado"
            );

        } else if (document.body.classList.contains("fail")) {

            document.getElementById("status").setAttribute(
                "aria-label",
                "Erro durante a execução"
            );

        }

    }

    const observer = new MutationObserver(function () {
        updateUI();
    });

    observer.observe(document.body, {
        attributes: true,
        attributeFilter: ["class"]
    });

    updateUI();

})();
