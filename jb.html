<!doctype html>
<html lang="pt-BR" manifest="cache.appcache">

<head>

    <link rel="icon" type="image/png" href="Icon.png">
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>KS4-JB · PS4 Exploit</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #0b0b0f;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        /* MAIN */

        #main-container {
            position: relative;

            width: 90%;
            max-width: 520px;

            min-height: 330px;

            padding: 38px 30px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            background: #111117;

            border: 1px solid #292932;
            border-radius: 18px;

            transition:
                border-color 0.3s ease;
        }

        /* LOGO */

        #brand {
            font-size: 42px;
            font-weight: 800;

            letter-spacing: -2px;

            margin-bottom: 8px;

            color: #ffffff;
        }

        #brand span {
            color: #4d8dff;

            transition:
                color 0.3s ease;
        }

        #subtitle {
            color: #8f8f9d;

            font-size: 14px;

            margin-bottom: 34px;
        }

        /* INDICATOR */

        #visual-indicator {
            position: relative;

            width: 72px;
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 26px;
        }

        .pulse {
            position: absolute;

            width: 100%;
            height: 100%;

            border-radius: 50%;

            border: 2px solid #4d8dff;

            animation: subtle-pulse 2s infinite ease-in-out;
        }

        .core {
            width: 28px;
            height: 28px;

            border-radius: 50%;

            background: #4d8dff;

            transition:
                background 0.3s ease;
        }

        #spin {
            position: absolute;

            width: 125%;
            height: 125%;

            border: 2px solid transparent;

            border-top-color: #ffffff;

            border-radius: 50%;

            animation: real-spin 0.9s linear infinite;

            opacity: 0.25;
        }

        /* STATUS */

        #status {
            min-height: 22px;

            color: #eeeeee;

            font-family: monospace;

            font-size: 15px;

            line-height: 1.5;
        }

        /* SUCCESS */

        body.done #main-container {
            border-color: rgba(245, 197, 66, 0.45);
        }

        body.done #brand span {
            color: #f5c542;
        }

        body.done .pulse {
            border-color: #f5c542;
            animation: none;
        }

        body.done .core {
            background: #f5c542;
        }

        body.done #spin {
            opacity: 0;
        }

        body.done #status {
            color: #f5c542;
            font-size: 0;
        }

        body.done #status::after {
            content: "Concluído";
            font-size: 15px;
        }

        /* ERROR */

        body.fail #main-container {
            border-color: rgba(255, 92, 92, 0.4);
        }

        body.fail #brand span {
            color: #ff5c5c;
        }

        body.fail .pulse {
            border-color: #ff5c5c;

            animation: none;
        }

        body.fail .core {
            background: #ff5c5c;
        }

        body.fail #spin {
            opacity: 0;
        }

        #msg {
            position: fixed;

            bottom: 62px;

            left: 0;
            right: 0;

            text-align: center;

            font-family: monospace;

            font-size: 13px;

            color: #ff5c5c;

            letter-spacing: 0.05em;

            display: none;
        }

        body.fail #msg {
            display: block;
        }

        /* LOG */

        #wrap {
            padding: 0;
        }

        #state,
        #out {
            display: none;
        }

        body.log {
            display: block;

            overflow: auto;

            padding: 20px;

            background: #0b0b0f;
        }

        body.log::before {
            display: none;
        }

        body.log #main-container,
        body.log #footer {
            display: none;
        }

        body.log #wrap {
            display: block;

            width: 100%;
            max-width: 900px;

            margin: 0 auto;
        }

        body.log #state {
            display: block;

            color: #ffffff;

            font-size: 18px;

            font-weight: 700;

            margin-bottom: 12px;

            font-family: monospace;
        }

        body.log #out {
            display: block;

            white-space: pre-wrap;

            font: 12px/1.6 monospace;

            background: #111117;

            border: 1px solid #292932;

            border-radius: 14px;

            padding: 16px;

            max-height: calc(100vh - 100px);

            overflow-y: auto;

            color: #eeeeee;
        }

        /* LOG COLORS */

        .ok {
            color: #4d8dff;
        }

        .bad {
            color: #ff5c5c;
        }

        .warn {
            color: #e0a84f;
        }

        .safe {
            color: #4d8dff;
        }

        .danger {
            color: #ff5c5c;
        }

        code {
            color: #8f8f9d;

            font-family: monospace;
        }

        /* FOOTER */

        #footer {
            position: fixed;

            bottom: 20px;

            left: 0;
            right: 0;

            text-align: center;

            font-family: monospace;

            font-size: 11px;

            color: #555560;

            letter-spacing: 0.08em;
        }

        #footer b {
            color: #777783;
        }

        /* ANIMATIONS */

        @keyframes real-spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes subtle-pulse {
            0% {
                transform: scale(0.92);
                opacity: 0.45;
            }

            50% {
                transform: scale(1.06);
                opacity: 0.8;
            }

            100% {
                transform: scale(0.92);
                opacity: 0.45;
            }
        }
    </style>
</head>

<body>

    <div id="main-container">

        <div id="brand">
            KS<span>4</span>
        </div>

        <div id="subtitle">
            KSOFCC · PS4 EXPLOIT
        </div>

        <div id="visual-indicator">

            <div id="spin"></div>

            <div class="pulse"></div>

            <div class="core"></div>

        </div>

        <div id="status">
            Preparando...
        </div>

    </div>

    <div id="msg">
        Reinicie o console
    </div>

    <div id="wrap">

        <div id="state"></div>

        <div id="out"></div>

    </div>

    <div id="footer">
        <b>KS4-JB</b> · 2026
    </div>

    <script type="module">
        import "./jb.js?v=10";
    </script>

</body>

</html>
